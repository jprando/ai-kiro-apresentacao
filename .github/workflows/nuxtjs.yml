# Publica a apresentação Nuxt (site estático) no GitHub Pages.
# Faz o build com o preset github_pages e a base URL do subcaminho /ai-kiro-apresentacao/.
name: Publicar apresentação no GitHub Pages

on:
  # Publica a cada push na branch principal
  push:
    branches: [main]
  # Permite disparo manual pela aba Actions
  workflow_dispatch:

# Permissões mínimas no nível do workflow
permissions:
  contents: read

# Não sobrepor deploys de Pages em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Habilita o pnpm na versão fixada (pin 11.24.0) ANTES do setup-node,
      # pois o cache 'pnpm' do setup-node exige o pnpm já disponível
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Build estático de Pages: define a base URL do subcaminho e usa o preset github_pages
      - name: Gerar build de Pages
        env:
          NUXT_APP_BASE_URL: /ai-kiro-apresentacao/
        run: pnpm nuxt build --preset github_pages

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Permissões necessárias para publicar no Pages via GITHUB_TOKEN automático
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
